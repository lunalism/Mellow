# Mellow — XcodeGen 프로젝트 명세
#
# Mellow.xcodeproj 는 이 파일에서 생성된다(`xcodegen generate`).
# 빌드 설정은 Xcode UI가 아니라 여기서만 수정한다.

name: Mellow

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # 서명은 Automatic.
    # 0-7(실기기 빌드·설치)에서 아래 줄의 주석을 풀고 10자리 Team ID를 넣는다.
    # DEVELOPMENT_TEAM: XXXXXXXXXX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Mellow:
    type: application
    platform: iOS

    sources:
      - path: Mellow                # 디렉터리 전체 스캔 — 파일 추가 시 yml 수정 불필요

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisholic.mellow
        PRODUCT_NAME: Mellow
        TARGETED_DEVICE_FAMILY: "1" # iPhone 전용
        ENABLE_PREVIEWS: "YES"

        # Swift 5 언어 모드 유지.
        # Phase 1은 촬영·병합 파이프라인을 검증하는 스파이크라
        # strict concurrency 대응에 시간을 쓰지 않는다.
        # 재검토 시점: Phase 2 시작 시 Swift 6 승격 여부를 다시 판단한다.
        SWIFT_VERSION: "5.0"

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        # ── Info.plist: 물리 파일 없이 빌드 설정으로 생성 ──
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

        INFOPLIST_KEY_NSCameraUsageDescription: "브이로그 클립을 촬영하는 데 카메라를 사용합니다."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "클립에 현장의 소리를 함께 담는 데 마이크를 사용합니다."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "완성한 브이로그를 사진 앱에 저장하는 데 사용합니다."

        # 세로 고정 — Portrait 하나만. UpsideDown/Landscape 는 넣지 않는다.
        # 가로 촬영은 인터페이스 회전이 아니라 기기 방향 감지로 처리한다.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

    scheme:
      testTargets: []
